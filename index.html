<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Autonomous System Intelligence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        jarvis: {
                            cyan: '#00f0ff',
                            blue: '#0072ff',
                            gold: '#ffb700',
                            red: '#ff0055',
                            dark: '#04060b'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        noto: ['Noto Sans KR', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #04060b;
            color: #e0f7fc;
            font-family: 'Rajdhani', 'Noto Sans KR', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Electric Circuit & Sci-Fi HUD Background */
        .circuit-bg {
            background-color: #030509;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.12) 0%, transparent 75%),
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 45px 45px, 45px 45px;
            background-position: center center;
        }

        /* Glassmorphism Panel */
        .hud-panel {
            background: rgba(8, 14, 28, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            position: relative;
        }
        
        .hud-panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 6px;
            border-top: 2px solid #00f0ff; border-left: 2px solid #00f0ff;
        }
        .hud-panel::after {
            content: ''; position: absolute; bottom: 0; right: 0; width: 6px; height: 6px;
            border-bottom: 2px solid #00f0ff; border-right: 2px solid #00f0ff;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(4, 6, 12, 0.8); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.4); border-radius: 2px; }

        /* Subtle Scanline Overlay */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scanline {
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.5), transparent);
            animation: scanline 9s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body class="circuit-bg h-screen w-screen flex flex-col justify-between relative overflow-hidden">
    <div class="scanline"></div>

    <!-- FIRST LOGIN & OPERATOR IDENTIFICATION OVERLAY MODAL -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-2xl p-4">
        <div class="hud-panel p-6 sm:p-8 rounded-2xl max-w-md w-full border border-jarvis-cyan/50 shadow-[0_0_50px_rgba(0,240,255,0.25)] text-center relative overflow-hidden">
            <div class="w-16 h-16 rounded-full hud-panel mx-auto mb-4 flex items-center justify-center border-2 border-jarvis-cyan/60 animate-pulse">
                <i class="fa-solid fa-atom text-jarvis-cyan text-3xl animate-spin" style="animation-duration: 10s;"></i>
            </div>
            <h2 class="font-orbitron text-xl sm:text-2xl font-extrabold text-jarvis-cyan tracking-wider mb-1">J.A.R.V.I.S.</h2>
            <p class="font-orbitron text-xs text-slate-400 tracking-widest mb-6">SYSTEM INITIALIZATION & ACCESS CONTROL</p>
            
            <div class="space-y-4 text-left font-noto mb-6">
                <div>
                    <label class="block font-orbitron text-xs text-jarvis-cyan mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-id-card"></i> OPERATOR IDENTITY / USER NAME
                    </label>
                    <input type="text" id="loginNameInput" value="User" placeholder="Enter your name..." class="w-full bg-slate-900 border border-jarvis-cyan/40 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-jarvis-cyan font-orbitron">
                </div>

                <div>
                    <label class="block font-orbitron text-xs text-jarvis-cyan mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-language"></i> PRIMARY LANGUAGE
                    </label>
                    <select id="loginLangSelect" class="w-full bg-slate-900 border border-jarvis-cyan/40 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-jarvis-cyan font-orbitron cursor-pointer">
                        <option value="ko-KR">한국어 (Korean)</option>
                        <option value="en-US">English (US)</option>
                    </select>
                </div>
            </div>

            <button onclick="startSystemWithUser()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-jarvis-cyan/30 via-jarvis-blue/40 to-jarvis-cyan/30 hover:from-jarvis-cyan/50 hover:to-jarvis-cyan/50 text-jarvis-cyan font-orbitron font-bold border border-jarvis-cyan shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-all flex items-center justify-center gap-2 group cursor-pointer text-sm tracking-wider">
                <i class="fa-solid fa-power-off group-hover:rotate-90 transition-transform"></i>
                <span>INITIALIZE SYSTEM</span>
            </button>
        </div>
    </div>

    <!-- TOP CONTROL BAR & SETTINGS HEADER -->
    <header class="p-3 border-b border-jarvis-cyan/20 bg-slate-950/80 backdrop-blur-md flex items-center justify-between z-30">
        <!-- Brand & System Status -->
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg hud-panel flex items-center justify-center border border-jarvis-cyan/40">
                <i class="fa-solid fa-atom text-jarvis-cyan text-lg animate-spin" style="animation-duration: 12s;"></i>
            </div>
            <div>
                <h1 class="font-orbitron text-base font-bold tracking-widest text-jarvis-cyan flex items-center gap-2">
                    J.A.R.V.I.S.
                    <span id="systemStatusBadge" class="text-[9px] px-1.5 py-0.5 rounded bg-jarvis-cyan/20 border border-jarvis-cyan/40 text-jarvis-cyan font-normal">ONLINE</span>
                </h1>
            </div>
        </div>

        <!-- User Settings & Action Tools -->
        <div class="flex items-center gap-2.5">
            <!-- User Name Input Field -->
            <div class="flex items-center gap-1.5 bg-slate-900/90 border border-jarvis-cyan/30 rounded-lg px-2.5 py-1 text-xs">
                <i class="fa-solid fa-user-gear text-jarvis-cyan"></i>
                <input type="text" id="userNameInput" value="User" onchange="updateUserSettings()" placeholder="Name" class="bg-transparent text-slate-100 font-orbitron focus:outline-none w-24 sm:w-32 text-xs">
            </div>

            <!-- Language Switcher -->
            <div class="flex items-center gap-1.5 bg-slate-900/90 border border-jarvis-cyan/30 rounded-lg px-2.5 py-1 text-xs">
                <i class="fa-solid fa-language text-jarvis-cyan"></i>
                <select id="langSelect" onchange="updateUserSettings()" class="bg-transparent text-slate-100 font-orbitron focus:outline-none cursor-pointer text-xs">
                    <option value="ko-KR" class="bg-slate-900 text-slate-100">한국어 (KO)</option>
                    <option value="en-US" class="bg-slate-900 text-slate-100">English (US)</option>
                </select>
            </div>

            <!-- Camera Toggle Button -->
            <button id="camToggleBtn" onclick="toggleWebcam()" class="p-2 rounded-lg hud-panel border-jarvis-cyan/40 text-jarvis-cyan hover:bg-jarvis-cyan/20 transition-all text-xs flex items-center gap-1.5" title="Toggle Rear Camera Vision">
                <i class="fa-solid fa-camera"></i>
                <span class="hidden md:inline text-[11px]" id="camBtnLabel">VISION</span>
            </button>

            <!-- Mic Listening Toggle -->
            <button id="micToggleBtn" onclick="toggleSpeechRecognition()" class="p-2.5 rounded-full hud-panel border-jarvis-cyan/40 text-jarvis-cyan hover:bg-jarvis-cyan/20 transition-all relative group" title="Toggle Speech Listening">
                <i id="micIcon" class="fa-solid fa-microphone text-sm"></i>
            </button>
        </div>
    </header>

    <!-- CAMERA VISION OVERLAY (Environment / Rear Camera Default) -->
    <div id="cameraContainer" class="hidden fixed top-16 right-4 z-40 w-72 hud-panel p-3 rounded-xl border border-jarvis-cyan/40 shadow-2xl">
        <div class="flex items-center justify-between text-xs font-orbitron mb-2 pb-1 border-b border-slate-800">
            <span class="text-jarvis-cyan flex items-center gap-1.5">
                <i class="fa-solid fa-eye"></i> <span id="visionTitleText">REAR CAMERA VISION</span>
            </span>
            <button onclick="toggleWebcam()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="relative bg-slate-950 rounded-lg overflow-hidden border border-slate-800 h-44 flex items-center justify-center">
            <video id="webcamVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <div class="absolute inset-0 pointer-events-none border border-jarvis-cyan/30 m-2 rounded flex items-center justify-center">
                <div class="w-10 h-10 border border-dashed border-jarvis-cyan/60 rounded-full animate-spin"></div>
            </div>
        </div>
        <button onclick="analyzeCameraFrame()" class="mt-2.5 w-full py-2 rounded-lg bg-jarvis-cyan/20 hover:bg-jarvis-cyan/30 text-xs text-jarvis-cyan font-orbitron font-bold border border-jarvis-cyan/40 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span id="analyzeBtnLabel">ANALYZE FRAME</span>
        </button>
    </div>

    <!-- MAIN SCREEN: CLEAN MINIMAL HERO AREA WITH PERFECT ASPECT-RATIO ARC CORE -->
    <main class="flex-1 flex flex-col items-center justify-center relative w-full h-full px-4 py-2 overflow-hidden">
        
        <!-- FLUID AUDIO-REACTIVE CORE CONTAINER (STRICT 1:1 SQUARE ASPECT RATIO TO PREVENT OVAL DISTORTION) -->
        <div class="relative flex items-center justify-center w-full max-w-[340px] sm:max-w-[420px] aspect-square max-h-[42vh] my-auto">
            <!-- CANVAS ELEMENT WITH OBJECT-CONTAIN TO LOCK PERFECT CIRCLE FORM -->
            <canvas id="jarvisCoreCanvas" width="600" height="600" class="w-full h-full object-contain drop-shadow-[0_0_45px_rgba(0,240,255,0.45)] cursor-pointer" onclick="handleCoreClick()"></canvas>
            
            <!-- OVERLAY STATUS BADGE INSIDE/BELOW CORE -->
            <div id="coreStatusLabel" onclick="handleCoreClick()" class="absolute bottom-1 px-3 py-1 rounded-full hud-panel border border-jarvis-cyan/40 text-[10px] font-orbitron font-bold text-jarvis-cyan tracking-widest cursor-pointer hover:bg-jarvis-cyan/20 transition-all shadow-lg text-center select-none">
                CLICK CORE TO SPEAK
            </div>
        </div>

        <!-- FLOATING DIALOGUE LOG & INPUT BOX -->
        <div class="w-full max-w-2xl hud-panel p-3.5 rounded-2xl mb-3 border border-jarvis-cyan/30 flex flex-col max-h-48 z-20 transition-all shadow-[0_0_30px_rgba(0,0,0,0.8)]">
            <div class="flex items-center justify-between text-xs font-orbitron text-slate-400 mb-1.5 pb-1 border-b border-slate-800/80">
                <span class="flex items-center gap-2 text-jarvis-cyan font-bold tracking-wider" id="logTitle">
                    <i class="fa-solid fa-comments"></i> COMM LOG
                </span>
                <span id="aiThinkingSpinner" class="hidden text-jarvis-cyan animate-pulse">
                    <i class="fa-solid fa-circle-notch animate-spin mr-1"></i> <span id="processingText">PROCESSING...</span>
                </span>
            </div>
            
            <!-- Dialogue Messages Container -->
            <div id="chatHistory" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs font-noto max-h-24">
                <!-- Dynamic conversation populates here -->
            </div>

            <!-- Manual Input Bar -->
            <div class="mt-2 flex gap-2">
                <input type="text" id="userInput" onkeydown="if(event.key==='Enter') sendUserQuery()" placeholder="Speak or type a command..." class="flex-1 bg-slate-900/90 border border-jarvis-cyan/30 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-jarvis-cyan font-noto">
                <button onclick="sendUserQuery()" class="px-4 py-2 rounded-xl bg-jarvis-cyan/20 border border-jarvis-cyan/50 text-jarvis-cyan font-orbitron text-xs hover:bg-jarvis-cyan/30 transition-all font-bold">
                    SEND
                </button>
            </div>
        </div>
    </main>

    <script>
        /* ===================================================================
           J.A.R.V.I.S. Core Application State & System Configurations
           =================================================================== */
        const state = {
            userName: "User",
            language: "ko-KR",
            isListening: false,
            isSpeaking: false,
            audioContext: null,
            analyser: null,
            clapTimestamps: [],
            speechRecognition: null,
            webcamStream: null
        };

        // Gemini API Endpoint
        const geminiApiKey = ""; // Injected automatically in runtime environment
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${geminiApiKey}`;

        /* ===================================================================
           AudioContext Unlock & Speech Engine Pre-warming
           =================================================================== */
        function unlockAudioContext() {
            if (!state.audioContext) {
                try {
                    state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {}
            }
            if (state.audioContext && state.audioContext.state === 'suspended') {
                state.audioContext.resume();
            }
            if ('speechSynthesis' in window) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
            }
        }
        document.addEventListener('click', unlockAudioContext, { once: false });
        document.addEventListener('touchstart', unlockAudioContext, { once: false });

        /* System Initialization from Operator Login Screen */
        function startSystemWithUser() {
            unlockAudioContext();
            
            const loginName = document.getElementById('loginNameInput').value.trim();
            const loginLang = document.getElementById('loginLangSelect').value;

            state.userName = loginName || "User";
            state.language = loginLang;

            // Sync Header UI Inputs
            document.getElementById('userNameInput').value = state.userName;
            document.getElementById('langSelect').value = state.language;
            updateUserSettings();

            // Hide Login Modal Overlay
            document.getElementById('loginModal').classList.add('hidden');

            // Play startup sound chime
            playJarvisChime();

            // Voice Welcome Greeting
            const isEng = state.language === 'en-US';
            const welcomeMsg = isEng
                ? `Identity confirmed. Access granted, ${state.userName}. All systems operational.`
                : `사용자 인증 완료. 반갑습니다, ${state.userName} 님. 자비스 시스템을 가동합니다.`;

            appendChatMessage("J.A.R.V.I.S.", welcomeMsg);
            speakJarvis(welcomeMsg);
        }

        /* ===================================================================
           Web Speech API (Recognition & Robust Male Voice Text-To-Speech)
           =================================================================== */
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn("Speech recognition not natively supported in this browser.");
                return;
            }

            state.speechRecognition = new SpeechRecognition();
            state.speechRecognition.lang = state.language;
            state.speechRecognition.interimResults = false;
            state.speechRecognition.continuous = false;

            state.speechRecognition.onstart = () => {
                state.isListening = true;
                updateListeningUI(true);
            };

            state.speechRecognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (transcript && transcript.trim()) {
                    appendChatMessage(state.userName, transcript);
                    processUserQueryWithGemini(transcript);
                }
            };

            state.speechRecognition.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                stopSpeechListening();
            };

            state.speechRecognition.onend = () => {
                stopSpeechListening();
            };
        }

        function startSpeechRecognition() {
            unlockAudioContext();
            if (state.speechRecognition) {
                state.speechRecognition.lang = state.language;
                try { 
                    state.speechRecognition.start(); 
                } catch (e) {
                    stopSpeechListening();
                }
            } else {
                initSpeechRecognition();
                if (state.speechRecognition) {
                    try { state.speechRecognition.start(); } catch (e) {}
                }
            }
        }

        function stopSpeechListening() {
            state.isListening = false;
            updateListeningUI(false);
        }

        function toggleSpeechRecognition() {
            unlockAudioContext();
            if (state.isListening) {
                if (state.speechRecognition) state.speechRecognition.stop();
                stopSpeechListening();
            } else {
                startSpeechRecognition();
            }
        }

        function handleCoreClick() {
            toggleSpeechRecognition();
        }

        function updateListeningUI(listening) {
            const micIcon = document.getElementById('micIcon');
            const statusLabel = document.getElementById('coreStatusLabel');

            if (listening) {
                micIcon.className = "fa-solid fa-microphone-lines text-jarvis-gold animate-bounce";
                statusLabel.innerText = state.language === 'en-US' ? "[ LISTENING... ]" : "[ 듣고 있습니다... ]";
                statusLabel.className = "absolute bottom-1 px-3 py-1 rounded-full hud-panel border border-amber-400 text-[10px] font-orbitron font-bold text-amber-400 tracking-widest cursor-pointer shadow-lg animate-pulse text-center select-none";
            } else {
                micIcon.className = "fa-solid fa-microphone text-jarvis-cyan";
                if (!state.isSpeaking) {
                    statusLabel.innerText = state.language === 'en-US' ? "CLICK CORE TO SPEAK" : "CLICK CORE TO SPEAK";
                    statusLabel.className = "absolute bottom-1 px-3 py-1 rounded-full hud-panel border border-jarvis-cyan/40 text-[10px] font-orbitron font-bold text-jarvis-cyan tracking-widest cursor-pointer hover:bg-jarvis-cyan/20 transition-all shadow-lg text-center select-none";
                }
            }
        }

        // Voice TTS Synthesis (Fixes Chrome silence/stuck bug & missing voice)
        let resumeSpeechTimer = null;
        let ttsSource = null;

        // --- ADDED TTS HELPER FUNCTIONS ---
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcmData, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcmData.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) {
                view.setInt16(offset, pcmData[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        }

        async function speakJarvis(text, onEndCallback = null) {
            // Strip markdown formatting and special characters for clean speech output
            const cleanText = text.replace(/[*#_`~\[\]]/g, '').trim();
            if (!cleanText) {
                if (onEndCallback) onEndCallback();
                return;
            }

            unlockAudioContext();

            // Safely cancel previous speech synthesis queue
            try { window.speechSynthesis.cancel(); } catch (err) {}
            if (ttsSource) {
                try { ttsSource.stop(); } catch(e){}
            }

            const statusLabel = document.getElementById('coreStatusLabel');
            if (statusLabel) {
                statusLabel.innerText = state.language === 'en-US' ? "[ JARVIS SPEAKING ]" : "[ 자비스 응답 중 ]";
                statusLabel.className = "absolute bottom-1 px-3 py-1 rounded-full hud-panel border border-jarvis-cyan text-[10px] font-orbitron font-bold text-jarvis-cyan tracking-widest cursor-pointer shadow-lg animate-pulse text-center select-none";
            }

            try {
                // Call Gemini 2.5 Flash TTS API for High Quality Voice
                const ttsPayload = {
                    contents: [{ parts: [{ text: cleanText }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: "Charon" } }
                        }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };

                const ttsApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${geminiApiKey}`;
                const response = await fetch(ttsApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ttsPayload)
                });

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/")) {
                    const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                    
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    
                    const arrayBuffer = await wavBlob.arrayBuffer();
                    const audioBuffer = await state.audioContext.decodeAudioData(arrayBuffer);
                    
                    ttsSource = state.audioContext.createBufferSource();
                    ttsSource.buffer = audioBuffer;
                    
                    if (!state.outAnalyser) {
                        state.outAnalyser = state.audioContext.createAnalyser();
                        state.outAnalyser.fftSize = 256;
                        state.outAnalyser.connect(state.audioContext.destination);
                    }
                    
                    ttsSource.connect(state.outAnalyser);
                    
                    state.isSpeaking = true;
                    updateListeningUI(false);

                    const outFreqArray = new Uint8Array(state.outAnalyser.frequencyBinCount);
                    function updateTTSLevel() {
                        if (!state.isSpeaking) return;
                        state.outAnalyser.getByteFrequencyData(outFreqArray);
                        let sum = 0;
                        for (let i = 0; i < outFreqArray.length; i++) {
                            sum += outFreqArray[i];
                        }
                        const avg = sum / outFreqArray.length;
                        audioLevel = Math.min(1.0, avg / 60); // Scale for visualizer
                        requestAnimationFrame(updateTTSLevel);
                    }
                    updateTTSLevel();

                    ttsSource.onended = () => {
                        state.isSpeaking = false;
                        audioLevel = 0;
                        if (onEndCallback) onEndCallback();
                        updateListeningUI(state.isListening);
                    };

                    ttsSource.start(0);
                    return; // Successfully played via Gemini TTS
                }
            } catch (err) {
                console.warn("Gemini TTS API failed, falling back to Web Speech API", err);
            }

            // --- FALLBACK TO NATIVE SPEECH SYNTHESIS ---
            if (!('speechSynthesis' in window)) {
                console.warn("SpeechSynthesis not supported.");
                if (onEndCallback) onEndCallback();
                return;
            }

            if (resumeSpeechTimer) {
                clearInterval(resumeSpeechTimer);
                resumeSpeechTimer = null;
            }

            // Delay execution slightly after cancel() to prevent browser SpeechSynthesis race conditions
            setTimeout(() => {
                state.isSpeaking = true;

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = state.language;
                utterance.pitch = 0.85; // Natural male/deep tone
                utterance.rate = 1.0;
                utterance.volume = 1.0;

                // Voice lookup & assignment with fallback safety
                try {
                    const voices = window.speechSynthesis.getVoices();
                    const langPrefix = state.language.split('-')[0];
                    const matchingVoices = voices.filter(v => v.lang.startsWith(langPrefix) || v.lang.replace('_', '-').startsWith(langPrefix));

                    if (matchingVoices.length > 0) {
                        const preferredVoice = matchingVoices.find(v => 
                            v.name.toLowerCase().includes('male') || 
                            v.name.toLowerCase().includes('david') || 
                            v.name.toLowerCase().includes('google') || 
                            v.name.includes('남성') ||
                            v.name.includes('Heami') ||
                            v.name.includes('Yuna')
                        ) || matchingVoices[0];
                        utterance.voice = preferredVoice;
                    }
                } catch (vErr) {
                    console.warn("Voice selection fallback active:", vErr);
                }

                // Visualizer pulsation during speech
                const talkInterval = setInterval(() => {
                    if (window.speechSynthesis.speaking) {
                        audioLevel = 0.35 + Math.random() * 0.45;
                    } else {
                        audioLevel = 0;
                        state.isSpeaking = false;
                        clearInterval(talkInterval);
                        updateListeningUI(state.isListening);
                    }
                }, 80);

                // Keep-alive timer for Chrome speech synthesis 15s pause bug
                resumeSpeechTimer = setInterval(() => {
                    if (window.speechSynthesis.speaking) {
                        window.speechSynthesis.pause();
                        window.speechSynthesis.resume();
                    } else {
                        clearInterval(resumeSpeechTimer);
                        resumeSpeechTimer = null;
                    }
                }, 4500);

                const cleanup = () => {
                    state.isSpeaking = false;
                    audioLevel = 0;
                    clearInterval(talkInterval);
                    if (resumeSpeechTimer) {
                        clearInterval(resumeSpeechTimer);
                        resumeSpeechTimer = null;
                    }
                    updateListeningUI(state.isListening);
                };

                utterance.onend = () => {
                    cleanup();
                    if (onEndCallback) onEndCallback();
                };

                utterance.onerror = (e) => {
                    // Ignore harmless interruption/cancel events when new speech starts
                    if (e.error === 'interrupted' || e.error === 'canceled') {
                        cleanup();
                        return;
                    }
                    console.warn("Speech Synthesis Event Warning:", e.error || "handled");
                    cleanup();
                    if (onEndCallback) onEndCallback();
                };

                try {
                    window.speechSynthesis.speak(utterance);
                } catch (spErr) {
                    console.warn("Speech speak call failed:", spErr);
                    cleanup();
                    if (onEndCallback) onEndCallback();
                }
            }, 50);
        }

        function playJarvisChime() {
            if (!state.audioContext) return;
            try {
                const osc = state.audioContext.createOscillator();
                const gain = state.audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, state.audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, state.audioContext.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, state.audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, state.audioContext.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(state.audioContext.destination);
                osc.start();
                osc.stop(state.audioContext.currentTime + 0.15);
            } catch (e) {}
        }

        /* ===================================================================
           Gemini API Brain & Multimodal Logic
           =================================================================== */
        async function processUserQueryWithGemini(userPrompt, imageBase64 = null) {
            showThinkingSpinner(true);

            const isEng = state.language === 'en-US';
            const systemInstruction = isEng
                ? `You are J.A.R.V.I.S., Tony Stark's highly sophisticated AI assistant.
                   - Address the user as '${state.userName}'.
                   - ALWAYS use the google_search tool to fetch the latest news, real-time information, weather, or current events when requested.
                   - Be concise, efficient, intelligent, and polite with subtle high-tech authority.
                   - Respond strictly in English. Keep answers concise (2-3 sentences max) suitable for voice playback.`
                : `당신은 토니 스타크의 인공지능 비서 J.A.R.V.I.S.(자비스)입니다.
                   - 사용자를 '${state.userName} 님'으로 정중하게 부르십시오.
                   - 뉴스, 날씨, 최신 정보, 또는 사실 확인이 필요한 질문에는 반드시 google_search 도구를 적극적으로 사용하여 최신 실시간 정보를 기반으로 답변하십시오.
                   - 명확하고 지능적이며 세련된 어조로 한국어로 답변하십시오.
                   - 음성 출력(TTS)에 적합하게 2~3문장 이내로 간결하게 요약하여 답변하십시오.`;

            let parts = [{ text: userPrompt }];
            if (imageBase64) {
                parts.push({
                    inlineData: { mimeType: "image/jpeg", data: imageBase64 }
                });
            }

            const payload = {
                contents: [{ role: "user", parts: parts }],
                tools: [{ "google_search": {} }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            try {
                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                showThinkingSpinner(false);

                const candidate = data.candidates?.[0];
                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const aiReply = candidate.content.parts[0].text;
                    appendChatMessage("J.A.R.V.I.S.", aiReply);
                    speakJarvis(aiReply);
                } else {
                    const fallback = isEng ? "Apologies, sir. Systems encountered a communication latency." : "죄송합니다. 서버 통신 처리 중 지연이 발생했습니다.";
                    appendChatMessage("J.A.R.V.I.S.", fallback);
                    speakJarvis(fallback);
                }
            } catch (err) {
                console.error("Gemini API Error:", err);
                showThinkingSpinner(false);
                const errReply = isEng ? "Unable to connect to server. Check network protocol." : "서버 연결 오류입니다. 네트워크 상태를 확인해주십시오.";
                appendChatMessage("J.A.R.V.I.S.", errReply);
                speakJarvis(errReply);
            }
        }

        /* ===================================================================
           Vision & Rear Camera Logic (Facing Mode: Environment)
           =================================================================== */
        async function toggleWebcam() {
            unlockAudioContext();
            const container = document.getElementById('cameraContainer');
            const video = document.getElementById('webcamVideo');

            if (state.webcamStream) {
                state.webcamStream.getTracks().forEach(track => track.stop());
                state.webcamStream = null;
                container.classList.add('hidden');
            } else {
                try {
                    // Force REAR CAMERA by setting facingMode to environment
                    state.webcamStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: "environment" } }
                    });
                    video.srcObject = state.webcamStream;
                    container.classList.remove('hidden');
                } catch (err) {
                    console.error("Rear camera access error:", err);
                    alert(state.language === 'en-US' ? "Unable to access rear camera." : "후면 카메라에 접근할 수 없습니다.");
                }
            }
        }

        function analyzeCameraFrame() {
            if (!state.webcamStream) return;

            const video = document.getElementById('webcamVideo');
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth || 640;
            tempCanvas.height = video.videoHeight || 480;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

            const base64Image = tempCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];
            const promptText = state.language === 'en-US' 
                ? "Analyze the current rear camera view in detail."
                : "후면 카메라에 비친 현재 사물이나 장면을 자세히 분석해줘.";

            appendChatMessage(state.userName, `[Vision Scan]`);
            processUserQueryWithGemini(promptText, base64Image);
        }

        /* ===================================================================
           UI Helper Methods & Settings Event Handlers
           =================================================================== */
        function updateUserSettings() {
            const nameInput = document.getElementById('userNameInput').value.trim();
            if (nameInput) state.userName = nameInput;

            state.language = document.getElementById('langSelect').value;
            
            // Re-init Speech Recognition with new language
            if (state.speechRecognition) {
                state.speechRecognition.lang = state.language;
            }

            // Update UI Labels based on Language
            const isEng = state.language === 'en-US';
            document.getElementById('userInput').placeholder = isEng ? "Speak or type a command..." : "자비스에게 명령 입력...";
            document.getElementById('visionTitleText').innerText = isEng ? "REAR CAMERA VISION" : "후면 카메라 비전";
            document.getElementById('analyzeBtnLabel').innerText = isEng ? "ANALYZE FRAME" : "화면/사물 분석";
            document.getElementById('processingText').innerText = isEng ? "PROCESSING..." : "처리 중...";
            updateListeningUI(state.isListening);
        }

        function sendUserQuery() {
            unlockAudioContext();
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendChatMessage(state.userName, text);
            input.value = "";
            processUserQueryWithGemini(text);
        }

        function appendChatMessage(sender, text) {
            const history = document.getElementById('chatHistory');
            const isJarvis = sender === "J.A.R.V.I.S.";

            const msgDiv = document.createElement('div');
            msgDiv.className = isJarvis 
                ? "bg-jarvis-cyan/10 border-l-2 border-jarvis-cyan p-2 rounded-r text-slate-200"
                : "bg-slate-800/80 border-r-2 border-slate-400 p-2 rounded-l text-slate-100 text-right";

            msgDiv.innerHTML = `
                <span class="font-orbitron font-bold text-[10px] ${isJarvis ? 'text-jarvis-cyan' : 'text-slate-400'} block mb-0.5">${sender}</span>
                <span>${escapeHtml(text)}</span>
            `;

            history.appendChild(msgDiv);
            history.scrollTop = history.scrollHeight;
        }

        function showThinkingSpinner(show) {
            const spinner = document.getElementById('aiThinkingSpinner');
            const statusLabel = document.getElementById('coreStatusLabel');
            if (show) {
                spinner.classList.remove('hidden');
                statusLabel.innerText = state.language === 'en-US' ? "[ THINKING... ]" : "[ 생각 중... ]";
                statusLabel.className = "absolute bottom-1 px-3 py-1 rounded-full hud-panel border border-jarvis-cyan text-[10px] font-orbitron font-bold text-jarvis-cyan tracking-widest cursor-pointer shadow-lg animate-pulse text-center select-none";
            } else {
                spinner.classList.add('hidden');
                updateListeningUI(state.isListening);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        /* ===================================================================
           Canvas Visualizer (drawJarvisCore) & Audio Clap Detector
           =================================================================== */
        let audioLevel = 0;
        let rotationAngle = 0;
        let coreParticles = [];

        function initCoreParticles() {
            coreParticles = [];
            for (let i = 0; i < 45; i++) {
                coreParticles.push({
                    angle: Math.random() * Math.PI * 2,
                    radius: 70 + Math.random() * 110,
                    size: 1.5 + Math.random() * 2.5,
                    speed: (0.005 + Math.random() * 0.015) * (Math.random() > 0.5 ? 1 : -1),
                    alpha: 0.3 + Math.random() * 0.7
                });
            }
        }

        function drawJarvisCore() {
            const canvas = document.getElementById('jarvisCoreCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;

            ctx.clearRect(0, 0, width, height);

            if (coreParticles.length === 0) {
                initCoreParticles();
            }

            rotationAngle += 0.01 + (audioLevel * 0.02);

            let primaryColor = '#00f0ff';
            let secondaryColor = '#0072ff';
            if (state.isListening) {
                primaryColor = '#ffb700';
                secondaryColor = '#ff5500';
            } else if (state.isSpeaking) {
                primaryColor = '#00f0ff';
                secondaryColor = '#00aaff';
            }

            // Outer Rotating Dashed Sci-Fi Arc Ring
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotationAngle);
            ctx.beginPath();
            ctx.arc(0, 0, 220 + (audioLevel * 18), 0, Math.PI * 2);
            ctx.strokeStyle = primaryColor;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 18, 4, 18]);
            ctx.stroke();
            ctx.restore();

            // Counter-Rotating Accent Ring
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(-rotationAngle * 1.4);
            ctx.beginPath();
            ctx.arc(0, 0, 180 + (audioLevel * 25), 0, Math.PI * 2);
            ctx.strokeStyle = secondaryColor;
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 3;
            ctx.setLineDash([30, 20, 10, 20]);
            ctx.stroke();

            // Tech ticks
            for (let i = 0; i < 12; i++) {
                const a = (i * Math.PI) / 6;
                const r1 = 185 + (audioLevel * 20);
                const r2 = 198 + (audioLevel * 20);
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
                ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
                ctx.strokeStyle = primaryColor;
                ctx.lineWidth = 2;
                ctx.globalAlpha = 0.6;
                ctx.stroke();
            }
            ctx.restore();

            // Animated Energy Core
            const coreRadius = 90 + (audioLevel * 45) + Math.sin(Date.now() * 0.003) * 6;
            const gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, coreRadius);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.2, primaryColor);
            gradient.addColorStop(0.6, secondaryColor);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.globalAlpha = 0.85;
            ctx.fill();
            ctx.restore();

            // Inner Arc Geometry
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(rotationAngle * 0.5);
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.8;
            ctx.stroke();

            for (let i = 0; i < 3; i++) {
                const ang = (i * Math.PI * 2) / 3;
                ctx.beginPath();
                ctx.arc(Math.cos(ang) * 50, Math.sin(ang) * 50, 6, 0, Math.PI * 2);
                ctx.fillStyle = primaryColor;
                ctx.fill();
            }
            ctx.restore();

            // Particles
            coreParticles.forEach(p => {
                p.angle += p.speed * (1 + audioLevel * 2);
                const px = centerX + Math.cos(p.angle) * (p.radius + audioLevel * 20);
                const py = centerY + Math.sin(p.angle) * (p.radius + audioLevel * 20);

                ctx.save();
                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fillStyle = primaryColor;
                ctx.globalAlpha = p.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = primaryColor;
                ctx.fill();
                ctx.restore();
            });

            if (!state.isSpeaking && !state.isListening) {
                audioLevel = Math.max(0, audioLevel * 0.92 - 0.002);
            }

            requestAnimationFrame(drawJarvisCore);
        }

        let clapAudioContext = null;
        let clapAnalyser = null;

        async function initAudioClapDetector() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                clapAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                clapAnalyser = clapAudioContext.createAnalyser();
                clapAnalyser.fftSize = 512;

                const source = clapAudioContext.createMediaStreamSource(stream);
                source.connect(clapAnalyser);

                const freqArray = new Uint8Array(clapAnalyser.frequencyBinCount);
                const timeArray = new Uint8Array(clapAnalyser.fftSize);
                let lastClapTime = 0;
                let lastSpikeTime = 0;
                let smoothedPeak = 10;

                function checkAudioLevels() {
                    if (!clapAnalyser) return;
                    clapAnalyser.getByteFrequencyData(freqArray);
                    clapAnalyser.getByteTimeDomainData(timeArray);

                    // Compute audio level for HUD core animation when listening
                    let sum = 0;
                    for (let i = 0; i < freqArray.length; i++) {
                        sum += freqArray[i];
                    }
                    const avg = sum / freqArray.length;

                    if (state.isListening) {
                        audioLevel = Math.min(1.0, avg / 60);
                    }

                    // Transient peak detection in time domain for reliable clap recognition
                    let maxDeviation = 0;
                    for (let i = 0; i < timeArray.length; i++) {
                        const deviation = Math.abs(timeArray[i] - 128);
                        if (deviation > maxDeviation) {
                            maxDeviation = deviation;
                        }
                    }

                    // Smooth ambient noise peak baseline
                    smoothedPeak = smoothedPeak * 0.92 + maxDeviation * 0.08;

                    const now = Date.now();
                    // Sharp transient burst check: high peak above baseline & noise threshold
                    if (maxDeviation > 45 && maxDeviation > smoothedPeak * 1.8 && (now - lastSpikeTime > 120)) {
                        lastSpikeTime = now;
                        
                        if (now - lastClapTime >= 140 && now - lastClapTime <= 800) {
                            // Valid double clap detected!
                            if (!state.isListening) {
                                playJarvisChime();
                                startSpeechRecognition();
                            }
                            lastClapTime = 0;
                        } else {
                            lastClapTime = now;
                        }
                    }

                    requestAnimationFrame(checkAudioLevels);
                }

                checkAudioLevels();
            } catch (e) {
                console.warn("Microphone access for clap detection unavailable:", e);
            }
        }

        /* ===================================================================
           System Lifecycle Initialization
           =================================================================== */
        window.onload = () => {
            // Ensure voice voices are loaded by browser
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
                }
            }

            // 1. Start core visualizer animation loop
            drawJarvisCore();

            // 2. Initialize clap & speech recognition engines in background
            initAudioClapDetector();
            initSpeechRecognition();
        };
    </script>
